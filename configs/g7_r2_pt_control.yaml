data:
  parquet_dir: date/DADS/data
  manifest_dir: artifacts/g7_leakage_fixed_v2/data
  audio_cache_dir: artifacts/g7_leakage_fixed_v2/data/cache
  sample_rate: 16000
  clip_seconds: 0.5
  per_class: all
  manifest_seed: 42
  splits: {train: 0.70, val: 0.15, test: 0.15}
  require_leakage_fixed_guard: true
  leakage_fixed_audit_path: artifacts/g7_leakage_fixed_v2/data/audit.json
  verify_leakage_fixed_cache_file: true
  input_audits:
    - artifacts/g7_leakage_fixed_v2/data/audit.json

features:
  type: waveform

model:
  type: panns_cnn14_16k
  initialization: audioset
  vendor_dir: artifacts/g7_panns/vendor/audioset_tagging_cnn/pytorch
  checkpoint_path: artifacts/g7_panns/checkpoints/Cnn14_16k_mAP=0.438.pth
  checkpoint_sha256: e2ee543a27919542c2ea03eabaa70b24dcd4e6c8e05621de6b67a94e4c5058e6
  spec_augment: false
  frontend_precision: float32

train:
  seeds: [42]
  batch_size: 128
  epochs: 15
  learning_rate: 0.0001
  lr_decay: 0.75
  patience: 4
  num_workers: 0
  device: cuda
  mixed_precision: true
  amp_init_scale: 8192.0
  pos_weight: auto

eval:
  thresholds: [0.40, 0.50, 0.65]

output_dir: artifacts/g7_r2_generalization/ablations/pt_control/runs
