protocol: g7_r4c_conservative_lowsnr_mix_v1

data:
  manifest_dir: artifacts/g7_r4_cross_dataset/p0_manifest
  sample_rate: 16000
  clip_seconds: 0.5
  input_audits:
    - artifacts/g7_r4_cross_dataset/p0_manifest/audit.json

features:
  type: waveform

model:
  type: panns_cnn14_16k
  initialization: audioset
  vendor_dir: artifacts/g7_panns/vendor/audioset_tagging_cnn/pytorch
  checkpoint_path: artifacts/g7_panns/checkpoints/Cnn14_16k_mAP=0.438.pth
  checkpoint_sha256: e2ee543a27919542c2ea03eabaa70b24dcd4e6c8e05621de6b67a94e4c5058e6
  binary_checkpoint_path: artifacts/g7_r2_generalization/ablations/pt_mic_bg_freq/runs/seed_42/best.pt
  binary_checkpoint_sha256: a960b60fff5b810d023fce64498006229c03bab3fde21ef52df7168c8942c447
  trainable_scope: fc1_and_binary_head
  spec_augment: false
  frontend_precision: float32
  frequency_masking:
    enabled: true
    probability: 0.50
    maximum_masks: 3
    maximum_width_fraction: 0.15
    fill: recording_mean

train:
  seeds: [42]
  batch_size: 128
  epochs: 8
  learning_rate: 1.0e-5
  lr_decay: 0.80
  patience: 3
  num_workers: 0
  device: cuda
  mixed_precision: true
  amp_init_scale: 8192.0
  pos_weight: auto
  sampling:
    type: class_source_sqrt_balanced_batch
    source_column: domain_bucket
    source_weight_exponent: 0.5
    samples_per_epoch: 65536
  augmentation:
    positive_mix_probability: 0.33
    mix_snr_db: [-15.0, -10.0, 10.0, 15.0, 20.0]
    mix_snr_weights: [0.075, 0.075, 0.283333, 0.283333, 0.283334]
    frequency_response_probability: 0.33
    frequency_response_mode: structured_microphone_v1
    microphone_highpass_hz: [60.0, 120.0]
    microphone_lowpass_hz: [6000.0, 8000.0]
    microphone_peaking_sections: [2, 3]
    microphone_peaking_center_hz: [120.0, 6000.0]
    microphone_peaking_q: [0.5, 2.0]
    microphone_peaking_gain_db: [-4.0, 4.0]
    reverb_probability: 0.0
    reverb_delay_ms: [12.0, 80.0]
    reverb_gain: [0.05, 0.25]
    colored_noise_probability: 0.0
    colored_noise_snr_db: [10.0, 30.0]
    time_shift_probability: 0.0
    max_time_shift_ms: 0.0

eval:
  thresholds: [0.40, 0.50, 0.65]

output_dir: artifacts/g7_r4_cross_dataset/r4c_lowsnr_conservative/runs
