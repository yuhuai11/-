baseline:
  name: crnn_full_augmented_g2
  config: configs/crnn_dads_full_augmented_g2.yaml
  checkpoint: archive/historical_models/superseded_champions/artifacts_crnn_full_augmented_g2/runs/seed_42/best.pt
  metrics: archive/historical_models/superseded_champions/artifacts_crnn_full_augmented_g2/runs/seed_42/metrics.json
  calibration: artifacts/val_ood/calibration/crnn_full_augmented_g2/seed_42/calibration.json
  model_type: crnn
  feature_type: log_mel
  predictions:
    tune: artifacts/val_ood/predictions/tune/crnn_full_augmented_g2/seed_42/predictions.csv
    holdout: artifacts/val_ood/predictions/holdout/crnn_full_augmented_g2/seed_42/predictions.csv

candidate:
  name: crnn_full_augmented_g5_mfcc64
  config: configs/crnn_dads_full_augmented_g5_mfcc64.yaml
  checkpoint: archive/historical_models/failed_candidates/artifacts_crnn_full_augmented_g5_mfcc64/runs/seed_42/best.pt
  metrics: archive/historical_models/failed_candidates/artifacts_crnn_full_augmented_g5_mfcc64/runs/seed_42/metrics.json
  calibration: artifacts/val_ood/calibration/crnn_full_augmented_g5_mfcc64/seed_42/calibration.json
  model_type: crnn
  feature_type: mfcc
  predictions:
    tune: artifacts/val_ood/predictions/tune/crnn_full_augmented_g5_mfcc64/seed_42/predictions.csv
    holdout: artifacts/val_ood/predictions/holdout/crnn_full_augmented_g5_mfcc64/seed_42/predictions.csv

screening_seed: 42
audit:
  path: artifacts/g5_mfcc64/delta_audit.json
  baseline_config: configs/crnn_dads_full_augmented_g2.yaml
  candidate_config: configs/crnn_dads_full_augmented_g5_mfcc64.yaml
keep_decision: keep_g2
promote_decision: promote_g5_mfcc64

guardrails:
  threshold: 0.50
  internal_screen:
    - {split: val, metric: f1, max_drop: 0.0020}
    - {split: val, metric: auc, max_drop: 0.0010}
    - {split: test, metric: f1, max_drop: 0.0020}
    - {split: test, metric: recall, floor: 0.9900}
    - {split: test, metric: specificity, floor: 0.9900}
    - {split: test, metric: auc, floor: 0.9950}
  external_promotion:
    scenario: temperature_selected
    checks:
      - {metric: f1, max_drop: 0.0}
      - {metric: balanced_accuracy, max_drop: 0.0}
      - {metric: recall, max_drop: 0.0}
      - {metric: specificity, max_drop: 0.0}
      - {metric: auc, max_drop: 0.0}
    minimum_improvement:
      any:
        - {metric: f1, delta: 0.0200}
        - {metric: recall, delta: 0.0300}
        - {metric: auc, delta: 0.0200}
    subgroup_checks:
      - {group_field: condition, group: uav_only, metric: recall, max_drop: 0.0300}
      - {group_field: condition, group: snr_+10_db, metric: recall, max_drop: 0.0300}
      - {group_field: condition, group: snr_+5_db, metric: recall, max_drop: 0.0300}
      - {group_field: condition, group: snr_+0_db, metric: recall, max_drop: 0.0300}
      - {group_field: condition, group: snr_-5_db, metric: recall, max_drop: 0.0300}
      - {group_field: condition, group: snr_-10_db, metric: recall, max_drop: 0.0300}
      - {group_field: condition, group: snr_-15_db, metric: recall, max_drop: 0.0300}
      - {group_field: condition, group: background_only, metric: specificity, max_drop: 0.0300}
  deployment_targets:
    recall: 0.80
    specificity: 0.90

output: artifacts/g5_mfcc64/gate.json
