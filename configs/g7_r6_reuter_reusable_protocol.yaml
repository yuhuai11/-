protocol: g7_r6_reuter_reusable_multicorpus_v3
task: binary_uav_detection
sample_rate: 16000
model_input_seconds: 0.5
split_unit: original_recording_session_and_source_group

base_manifests:
  train: artifacts/g7_r5_train_val_test/train_manifest.csv
  validation: artifacts/g7_r5_train_val_test/validation_manifest.csv
  internal_benchmark: artifacts/g7_r5_train_val_test/internal_test_manifest.csv
  external_benchmark: artifacts/g7_r5_train_val_test/locked_unseen_external_test/manifest.csv
  dronenoise_halfsecond: artifacts/g7_r6_dronenoise_halfsec_cache/halfsecond_manifest.csv

development_partition:
  tau_model_validation_prefixes:
    - tau_urban_2022:lisbon-
  tau_threshold_calibration_prefixes:
    - tau_urban_2022:prague-

roles:
  train:
    model_updates_allowed: true
    sources: [DADS_train, Kielce_train, TAU_train, G9_train, DroneNoise_train]
  model_validation:
    model_selection_allowed: true
    threshold_calibration_allowed: false
    sources: [DADS_validation, Kielce_tune, TAU_Lisbon_tune, DroneNoise_validation]
  threshold_calibration:
    model_selection_allowed: false
    threshold_calibration_allowed: true
    sources: [TAU_Prague_tune]
  reusable_internal_benchmark:
    repeat_evaluation_allowed: true
    threshold_calibration_allowed: false
    independent_final_claim_allowed: false
    sources: [DADS_test_consumed]
  reusable_external_benchmark:
    repeat_evaluation_allowed: true
    cross_version_comparison_allowed: true
    ablation_reporting_allowed: true
    threshold_calibration_allowed: false
    independent_final_claim_allowed: false
    sources:
      - Kielce_dev_holdout_consumed
      - TAU_dev_holdout_consumed
      - DDL_AeroSonic_G13_consumed
      - IDMT_TRAFFIC_consumed
      - ESC50_consumed
      - DroneNoise_positive_test_v1

new_dataset_intake:
  - source_id: dronenoise_database_v3
    intended_role: event_grouped_train_expansion_validation_and_reusable_positive_test
    priority: 1
    status: integrated_native_halfsecond_train_validation_and_reusable_positive_test_v1
  - source_id: idmt_berne_2022
    intended_role: reusable_ood_positive_benchmark
    priority: 2
    status: pending_official_archive_license_and_overlap_audit
  - source_id: new_ground_array_uav_sessions
    intended_role: reusable_ood_positive_benchmark
    priority: 2
    status: recommended_missing
  - source_id: new_deployment_background_sessions
    intended_role: reusable_ood_negative_benchmark
    priority: 2
    status: recommended_missing
  - source_id: audrok_ood
    intended_role: reusable_ood_positive_benchmark
    priority: 2
    status: deferred_until_dads_content_overlap_audit
  - source_id: uavirbase
    intended_role: optional_array_stress_benchmark
    priority: 3
    status: reserve_domain_mismatch_and_historical_intake
  - source_id: droneaudioset
    intended_role: optional_onboard_ego_noise_stress_benchmark
    priority: 3
    status: reserve_domain_mismatch
  - source_id: nasa_small_uas
    intended_role: none_until_license_resolution
    priority: 4
    status: prohibited_for_inference_or_training

benchmark_policy:
  repeat_evaluation_allowed: true
  compare_all_predeclared_models: true
  compare_seeds: [42, 43, 44]
  reuse_same_examples_for_paired_comparison: true
  threshold_source: threshold_calibration_only
  threshold_targets_fpr: [0.01, 0.05]
  fixed_0_5_also_reported: true
  recording_aggregation: mean_probability_over_native_half_second_views
  forbid_threshold_fit_on_benchmark: true
  forbid_training_on_benchmark_in_same_experiment_series: true
  independent_final_claim_allowed: false
  identical_checkpoint_repeated_inference_has_no_statistical_value: true
  benchmark_status: consumed_reusable_development_benchmark
  corpus_label_shortcut_is_promotion_evidence: false
  require_model_input_identity_audit: true
  require_dataset_origin_label_purity_audit: true
  require_source_group_metrics: true
  prohibit_independent_external_claim: true

promotion_gates:
  operating_point: fixed_0_5
  required_non_regression:
    - kielce_tau_source_group_macro_balanced_accuracy
    - kielce_tau_source_group_macro_false_positive_rate
    - g13_source_group_macro_balanced_accuracy
    - g13_recording_roc_auc
    - idmt_source_group_macro_false_positive_rate
    - esc50_source_group_macro_false_positive_rate
  allow_kielce_improvement_to_override_other_domain_regression: false
  independent_final_confirmation_required_for_deployment_claim: true

reporting:
  primary_unit: recording
  clustered_primary_unit: source_group_macro_over_recording_metrics
  secondary_unit: native_half_second_segment_diagnostic_only
  uncertainty:
    - three_seed_mean_and_standard_deviation
    - paired_recording_bootstrap_95ci
  metrics:
    - accuracy
    - precision
    - recall
    - f1
    - false_positive_rate
    - roc_auc
    - pr_auc
    - standardized_pauc_fpr_le_0_05
    - tpr_at_calibrated_fpr_0_01
    - tpr_at_calibrated_fpr_0_05
    - recall_by_uav_type
    - recall_by_session
    - false_alarms_per_hour
  mandatory_limitations:
    - kielce_positive_and_tau_negative_are_corpus_label_confounded
    - g13_source_groups_are_label_pure
    - idmt_and_esc50_are_negative_only_stress_sets
    - all_current_external_benchmarks_are_consumed_and_reusable

output_dir: artifacts/g7_r6_reusable_multicorpus
