[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "acoustic-uav-open-set-identification"
version = "0.1.0"
description = "Acoustic UAV detection and open-set model identification, evolved from a DADS CRNN reproduction."
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "pyarrow>=14.0",
  "PyYAML>=6.0",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "matplotlib>=3.7",
  "seaborn>=0.13",
  "tqdm>=4.66",
  "torch>=2.0",
]

[tool.setuptools.packages.find]
where = ["src"]
